<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020c20">
<title>Denver Studios</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');

:root {
    --cyan: #8af7ff;
    --blue: #20cfff;
    --white: #f4fcff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100svh;
    overflow: hidden;
    background: #020c20;
    color: var(--white);
    font-family: 'Outfit', sans-serif;
}

button, a {
    -webkit-tap-highlight-color: transparent;
}

.scene {
    position: fixed;
    inset: 0;
    isolation: isolate;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 42%,
            rgba(24, 137, 191, .3), transparent 40%),
        linear-gradient(
            180deg,
            #06132e 0%,
            #132a57 19%,
            #5a3972 35%,
            #ee8c91 49%,
            #f8bca2 54%,
            #087eaa 55%,
            #063e68 75%,
            #020c20 100%
        );
}

/* ATMOSPHERIC GLOW */

.aurora {
    position: absolute;
    inset: -30%;
    opacity: .42;
    filter: blur(65px);
    background: conic-gradient(
        from 40deg at 50% 50%,
        transparent,
        rgba(34, 242, 255, .2),
        transparent 20%,
        rgba(131, 67, 255, .24),
        transparent 45%,
        rgba(38, 190, 255, .18),
        transparent 65%
    );
    animation: aurora 24s ease-in-out infinite alternate;
}

@keyframes aurora {
    from { transform: rotate(-12deg) scale(1); }
    to { transform: rotate(15deg) scale(1.2); }
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(1px 1px at 8% 12%, #fff, transparent),
        radial-gradient(2px 2px at 18% 23%, #a4f7ff, transparent),
        radial-gradient(1px 1px at 32% 9%, #fff, transparent),
        radial-gradient(2px 2px at 48% 17%, #fff, transparent),
        radial-gradient(1px 1px at 64% 8%, #fff, transparent),
        radial-gradient(1px 1px at 79% 20%, #a4f7ff, transparent),
        radial-gradient(2px 2px at 91% 10%, #fff, transparent),
        radial-gradient(1px 1px at 86% 33%, #fff, transparent),
        radial-gradient(1px 1px at 25% 34%, #fff, transparent),
        radial-gradient(2px 2px at 56% 27%, #a4f7ff, transparent);
    background-size: 350px 270px;
    opacity: .75;
    animation: starDrift 70s linear infinite;
}

@keyframes starDrift {
    to { background-position: 350px -270px; }
}

/* SUNSET */

.sun {
    position: absolute;
    width: clamp(145px, 25vw, 270px);
    aspect-ratio: 1;
    border-radius: 50%;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(
        180deg,
        #fffbd6 0%,
        #ffe7b4 27%,
        #ffb8b9 64%,
        #fa8dc7 100%
    );
    box-shadow:
        0 0 35px rgba(255, 225, 197, .5),
        0 0 100px rgba(255, 149, 194, .4),
        0 0 230px rgba(255, 115, 190, .18);
    overflow: hidden;
    animation: sunBreath 7s ease-in-out infinite;
}

.sun::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 12px,
        rgba(95, 51, 104, .35) 13px,
        rgba(95, 51, 104, .35) 17px
    );
    mask-image: linear-gradient(to bottom, transparent 35%, black 55%);
}

@keyframes sunBreath {
    50% {
        box-shadow:
            0 0 55px rgba(255, 225, 197, .65),
            0 0 130px rgba(255, 149, 194, .48),
            0 0 250px rgba(255, 115, 190, .22);
    }
}

.sun-halo {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: min(85vw, 800px);
    height: 450px;
    background: radial-gradient(
        ellipse,
        rgba(255, 145, 204, .16),
        transparent 68%
    );
    pointer-events: none;
}

/* DISTANT MOUNTAINS */

.mountains {
    position: absolute;
    left: -5%;
    bottom: 39%;
    width: 110%;
    height: 170px;
    background: linear-gradient(180deg, #332e59, #132c4b);
    clip-path: polygon(
        0 80%, 8% 48%, 15% 66%, 23% 23%,
        31% 62%, 40% 38%, 49% 71%, 59% 17%,
        69% 60%, 78% 30%, 88% 65%, 95% 43%,
        100% 60%, 100% 100%, 0 100%
    );
    opacity: .75;
}

/* OCEAN DEPTH */

.ocean {
    position: absolute;
    inset: 52% 0 0;
    overflow: hidden;
    background:
        linear-gradient(
            180deg,
            rgba(31, 185, 213, .68) 0%,
            rgba(8, 109, 160, .92) 26%,
            #06375c 65%,
            #020c20 100%
        );
}

.horizon-glow {
    position: absolute;
    top: -35px;
    left: -20%;
    width: 140%;
    height: 85px;
    background: #ffc2c0;
    opacity: .22;
    filter: blur(35px);
}

.water-reflection {
    position: absolute;
    top: 0;
    left: 50%;
    width: 70%;
    height: 100%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 9px,
        rgba(179, 250, 255, .22) 10px,
        transparent 12px,
        transparent 20px
    );
    mask-image: linear-gradient(
        180deg,
        rgba(0,0,0,.9),
        transparent 85%
    );
    animation: reflection 5s ease-in-out infinite alternate;
}

@keyframes reflection {
    from {
        transform: translateX(-50%) scaleX(.65);
        opacity: .4;
    }
    to {
        transform: translateX(-50%) scaleX(1.1);
        opacity: .9;
    }
}

.wave {
    position: absolute;
    top: -25px;
    left: -60%;
    width: 220%;
    height: 90px;
    border-radius: 46%;
    border-top: 2px solid rgba(184, 252, 255, .8);
    background: linear-gradient(
        180deg,
        rgba(151, 247, 255, .2),
        transparent
    );
    box-shadow: 0 -8px 35px rgba(65, 224, 255, .1);
    animation: waveMotion 12s linear infinite;
}

.wave:nth-child(2) {
    top: 5px;
    opacity: .55;
    animation-duration: 16s;
    animation-direction: reverse;
}

.wave:nth-child(3) {
    top: 35px;
    opacity: .32;
    animation-duration: 20s;
}

.wave:nth-child(4) {
    top: 65px;
    opacity: .23;
    animation-duration: 14s;
}

.wave:nth-child(5) {
    top: 100px;
    opacity: .17;
    animation-duration: 22s;
}

@keyframes waveMotion {
    from { transform: translateX(0) rotate(0); }
    to { transform: translateX(18%) rotate(360deg); }
}

/* SHIMMERING BEACH */

.sand {
    position: absolute;
    bottom: -35%;
    left: -20%;
    width: 140%;
    height: 60%;
    border-radius: 50% 50% 0 0;
    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(255, 231, 204, .8),
            transparent 24%
        ),
        linear-gradient(
            180deg,
            #b8b5b0 0%,
            #697e8d 20%,
            #203e59 52%,
            #020c20 100%
        );
    box-shadow: 0 -5px 45px rgba(153, 247, 255, .16);
}

.sand::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .35;
    background: repeating-linear-gradient(
        170deg,
        transparent 0px,
        transparent 18px,
        rgba(255,255,255,.3) 19px,
        transparent 20px
    );
    mask-image: linear-gradient(to bottom, black, transparent 70%);
}

/* FOREGROUND PARTICLES */

#fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* CINEMATIC EDGE LIGHTING */

.vignette {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(2, 8, 24, .12),
            transparent 30%,
            transparent 60%,
            rgba(1, 8, 23, .58)
        ),
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(1, 5, 20, .36) 100%
        );
}

/* INTERFACE */

header {
    position: relative;
    z-index: 5;
    width: min(1100px, calc(100% - 44px));
    margin: 0 auto;
    padding-top: 28px;
    display: flex;
    justify-content: center;
}

.brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255,255,255,.9);
    text-shadow: 0 0 24px rgba(109, 239, 255, .4);
}

.brand span {
    color: var(--cyan);
}

main {
    position: relative;
    z-index: 4;
    min-height: calc(100svh - 65px);
    padding: 25px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 15px;
    border: 1px solid rgba(220, 250, 255, .23);
    border-radius: 100px;
    background: rgba(8, 29, 59, .3);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font-size: 9px;
    letter-spacing: 3px;
    color: #d6faff;
    animation: enter .9s .1s both;
}

.live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 13px var(--cyan);
    animation: blink 2s infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

h1 {
    margin-top: 29px;
    font-size: clamp(48px, 10.5vw, 112px);
    font-weight: 800;
    letter-spacing: -.065em;
    line-height: .91;
    text-shadow: 0 12px 65px rgba(1, 11, 31, .3);
    animation: enter 1s .2s both;
}

h1 .first {
    display: block;
    color: #fff;
}

h1 .second {
    display: block;
    margin-top: 9px;
    color: transparent;
    background: linear-gradient(
        100deg,
        #ffffff 0%,
        #b9faff 25%,
        #77e8ff 48%,
        #e2d9ff 72%,
        #ffffff 100%
    );
    background-size: 250% auto;
    background-clip: text;
    -webkit-background-clip: text;
    filter: drop-shadow(0 0 25px rgba(91, 233, 255, .2));
    animation: titleGlow 7s linear infinite;
}

@keyframes titleGlow {
    to { background-position: 250% center; }
}

.description {
    max-width: 370px;
    margin-top: 24px;
    color: rgba(240, 251, 255, .79);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.9;
    animation: enter 1s .35s both;
}

.bottom-action {
    margin-top: 36px;
    animation: enter 1s .5s both;
}

.key-button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    min-width: 225px;
    padding: 17px 26px;
    border: 1px solid rgba(255, 255, 255, .78);
    border-radius: 14px;
    color: #07192d;
    background: linear-gradient(
        120deg,
        #ffffff,
        #c6fbff 45%,
        #83efff
    );
    background-size: 200% auto;
    box-shadow:
        0 0 0 5px rgba(157, 244, 255, .07),
        0 8px 35px rgba(39, 220, 255, .22),
        inset 0 1px 0 rgba(255,255,255,.9);
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    transition:
        transform .3s ease,
        box-shadow .3s ease,
        background-position .5s ease;
    overflow: hidden;
}

.key-button::before {
    content: "";
    position: absolute;
    top: -80%;
    left: -50%;
    width: 30%;
    height: 260%;
    transform: rotate(25deg);
    background: rgba(255,255,255,.75);
    filter: blur(8px);
    transition: left .6s ease;
}

.key-button:hover::before {
    left: 130%;
}

.key-button:hover {
    transform: translateY(-4px) scale(1.025);
    background-position: right center;
    box-shadow:
        0 0 0 6px rgba(157, 244, 255, .1),
        0 15px 50px rgba(39, 220, 255, .4);
}

.key-button:active {
    transform: scale(.98);
}

.key-icon {
    font-size: 18px;
    line-height: 1;
}

.key-arrow {
    font-size: 16px;
    transition: transform .3s;
}

.key-button:hover .key-arrow {
    transform: translate(3px, -3px);
}

.caption {
    margin-top: 16px;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(236, 250, 255, .55);
    animation: enter 1s .65s both;
}

.footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    color: rgba(235, 249, 255, .54);
    font-size: 9px;
    letter-spacing: 2.5px;
}

.footer-line {
    width: 25px;
    height: 1px;
    background: rgba(218, 249, 255, .38);
}

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* MOBILE */

@media (max-width: 600px) {
    header {
        padding-top: 24px;
    }

    main {
        padding: 15px 18px 80px;
    }

    .sun {
        top: 23%;
        width: 155px;
    }

    .mountains {
        bottom: 39%;
        height: 100px;
    }

    .ocean {
        inset-top: auto;
        top: 52%;
    }

    .description {
        max-width: 310px;
        font-size: 13px;
    }

    .key-button {
        min-width: 230px;
        min-height: 53px;
    }

    .footer {
        bottom: 14px;
        font-size: 8px;
        letter-spacing: 1.7px;
    }
}

@media (max-height: 650px) {
    main {
        padding-top: 10px;
        padding-bottom: 65px;
    }

    h1 {
        margin-top: 18px;
        font-size: clamp(43px, 8vw, 78px);
    }

    .description {
        margin-top: 15px;
    }

    .bottom-action {
        margin-top: 22px;
    }

    .sun {
        top: 13%;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="scene">
    <div class="aurora"></div>
    <div class="stars"></div>
    <div class="sun-halo"></div>
    <div class="sun"></div>
    <div class="mountains"></div>

    <div class="ocean">
        <div class="horizon-glow"></div>
        <div class="water-reflection"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="sand"></div>
    </div>

    <canvas id="fx"></canvas>
    <div class="vignette"></div>
</div>

<header>
    <div class="brand">DENVER <span>®</span> STUDIOS</div>
</header>

<main>
    <div class="label">
        <span class="live-dot"></span>
        YOUR NEXT DESTINATION
    </div>

    <h1>
        <span class="first">DENVER</span>
        <span class="second">STUDIOS</span>
    </h1>

    <p class="description">
        A world of its own. Discover the experience,
        explore the atmosphere, and make your next move.
    </p>

    <div class="bottom-action">
        <a class="key-button"
           href="#"
           target="_blank"
           rel="noopener noreferrer">
            <span class="key-icon">✧</span>
            <span>GET KEY (LOOTLABS)</span>
            <span class="key-arrow">↗</span>
        </a>
    </div>

    <div class="caption">
        BUILT DIFFERENT. DESIGNED TO STAND OUT.
    </div>
</main>

<div class="footer">
    <span class="footer-line"></span>
    DENVER STUDIOS
    <span class="footer-line"></span>
</div>

<script>
/* OPTIMIZED FLOATING LIGHT PARTICLES */

(() => {
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");

    if (!ctx) return;

    let width = 0;
    let height = 0;
    let particles = [];
    let frame = 0;
    let running = false;

    const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    );

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(
            85,
            Math.max(30, Math.floor(width * height / 12000))
        );

        particles = Array.from({ length: count }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.7 + .3,
            speed: Math.random() * .38 + .08,
            drift: (Math.random() - .5) * .24,
            phase: Math.random() * Math.PI * 2,
            alpha: Math.random() * .6 + .15
        }));
    }

    function draw() {
        if (!running || reducedMotion.matches) return;

        ctx.clearRect(0, 0, width, height);
        frame += .012;

        for (const p of particles) {
            p.y -= p.speed;
            p.x += p.drift;

            if (p.y < -5) {
                p.y = height + 5;
                p.x = Math.random() * width;
            }

            if (p.x < -5) p.x = width + 5;
            if (p.x > width + 5) p.x = -5;

            const shimmer = .55 + .45 * Math.sin(frame + p.phase);

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle =
                `rgba(170,245,255,${p.alpha * shimmer})`;
            ctx.fill();
        }

        requestAnimationFrame(draw);
    }

    function start() {
        if (running || reducedMotion.matches) return;
        running = true;
        draw();
    }

    function stop() {
        running = false;
    }

    resize();
    start();

    window.addEventListener("resize", resize, { passive: true });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stop();
        } else {
            start();
        }
    });

    reducedMotion.addEventListener("change", () => {
        stop();
        if (!reducedMotion.matches) start();
    });
})();
</script>

</body>
</html>
